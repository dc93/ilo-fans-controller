name: Push Docker image to the GitHub Container Registry (GHCR)

on:
  push:
    branches:
      - main
    tags:
      - v*
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag'
        required: true
        default: 'develop'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    name: Docker Build and Push
    runs-on: ubuntu-latest

    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true

    permissions:
      contents: read
      packages: write

    steps:
      - name: Lowercase the image name
        run: echo IMAGE_NAME="${IMAGE_NAME,,}" >> $GITHUB_ENV

      - name: Get repository tags
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            TAG=${{ github.event.inputs.tag }}
          elif [[ $GITHUB_REF == refs/tags/* ]]; then
            TAG=${GITHUB_REF#refs/tags/}
          else
            TAG=latest
          fi
          echo "TAG=$TAG" >> "$GITHUB_ENV"

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          install: true

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag the image
        run: |
          echo "IMAGE_TAG=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.TAG }}" >> "$GITHUB_ENV"

          if [[ ${{ env.TAG }} == v* ]]; then
            echo "LATEST_TAG=,${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest" >> "$GITHUB_ENV"
          fi

      - name: Build and Push the image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE_TAG }}${{ env.LATEST_TAG }}

      - name: Clean up untagged images
        continue-on-error: true
        run: |
          echo "Cleaning up untagged container images..."

          # Extract repository name
          REPO_NAME=$(echo "${{ github.repository }}" | awk -F'/' '{print $2}')

          # Get all package versions that have no tags (untagged images)
          UNTAGGED_IMAGES=$(gh api \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "/users/${{ github.repository_owner }}/packages/container/${REPO_NAME}/versions" \
            --jq '.[] | select(.metadata.container.tags | length == 0) | .id')

          # Delete each untagged image
          if [ -n "$UNTAGGED_IMAGES" ]; then
            echo "Found untagged images to delete"
            for image_id in $UNTAGGED_IMAGES; do
              echo "Deleting untagged image with ID: $image_id"
              gh api \
                --method DELETE \
                -H "Accept: application/vnd.github+json" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "/users/${{ github.repository_owner }}/packages/container/${REPO_NAME}/versions/${image_id}" \
                && echo "Successfully deleted image $image_id" \
                || echo "Failed to delete image $image_id"
            done
            echo "Cleanup completed"
          else
            echo "No untagged images found"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
